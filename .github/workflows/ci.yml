name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run linter
      run: bun run lint

    - name: Run tests
      run: bun run test

    - name: Build application
      env:
        DATABASE_URL: "postgres://postgres:password@localhost:5432/priisme_test"
        BETTER_AUTH_SECRET: "dummy_secret_for_build"
        STRIPE_SECRET_KEY: "dummy_stripe_secret_for_build"
        RESEND_API_KEY: "dummy_resend_key_for_build"
        BETTER_AUTH_URL: "http://localhost:3000"
      run: bun run build
